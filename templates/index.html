<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Car Price Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .output {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #eef2f7;
            border-radius: 8px;
            min-height: 40px;
            box-sizing: border-box;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Car Price Prediction</h2>

    <form>

        <input type="text"
               name="Name"
               placeholder="Car Name"
               required>

        <input type="number"
               name="Year"
               placeholder="Year"
               required>

        <input type="number"
               name="Kilometers_Driven"
               placeholder="Kilometers Driven"
               required>

        <select name="Fuel_Type" required>

            <option value="">Select Fuel Type</option>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="CNG">CNG</option>
            <option value="Electric">Electric</option>

        </select>

        <select name="Transmission" required>

            <option value="">Select Transmission</option>
            <option value="Manual">Manual</option>
            <option value="Automatic">Automatic</option>

        </select>

        <select name="Owner_Type" required>

            <option value="">Select Owner Type</option>
            <option value="First">First</option>
            <option value="Second">Second</option>
            <option value="Third">Third</option>
            <option value="Fourth & Above">Fourth & Above</option>

        </select>

        <input type="number"
               step="0.1"
               name="Mileage"
               placeholder="Mileage"
               required>

        <input type="number"
               name="Engine"
               placeholder="Engine (CC)"
               required>

        <input type="number"
               step="0.1"
               name="Power"
               placeholder="Power (bhp)"
               required>

        <input type="number"
               name="Seats"
               placeholder="Seats"
               required>

        <button type="button"
                onclick="showOutput()">

            Predict Price

        </button>

    </form>

    <div class="output" id="outputText">
        Output will appear here...
    </div>

</div>

<script>

async function showOutput() {
    
    let Name = document.getElementsByName("Name")[0].value;

    let Year = Number(
        document.getElementsByName("Year")[0].value
    );

    let Kilometers_Driven = Number(
        document.getElementsByName("Kilometers_Driven")[0].value
    );

    let Fuel_Type = document.getElementsByName("Fuel_Type")[0].value;

    let Transmission = document.getElementsByName("Transmission")[0].value;

    let Owner_Type = document.getElementsByName("Owner_Type")[0].value;

    let Mileage = Number(
        document.getElementsByName("Mileage")[0].value
    );

    let Engine = Number(
        document.getElementsByName("Engine")[0].value
    );

    let Power = Number(
        document.getElementsByName("Power")[0].value
    );

    let Seats = Number(
        document.getElementsByName("Seats")[0].value
    );

    document.getElementById("outputText").innerText =
        "Analyzing...";

    try {
        let response = await fetch("/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                Name: Name,
                Year: Year,
                Kilometers_Driven: Kilometers_Driven,
                Fuel_Type: Fuel_Type,
                Transmission: Transmission,
                Owner_Type: Owner_Type,
                Mileage: Mileage,
                Engine: Engine,
                Power: Power,
                Seats: Seats

            })

        });

        let result = await response.json();

        console.log(result);

        if (response.ok) {

            document.getElementById("outputText").innerText =
                "Predicted Price: ₹ " + result.prediction + "Lakhs";

        }

        else {

            document.getElementById("outputText").innerText =
                "Backend Error: " + result.error;

        }

    }
    catch (error) {

        document.getElementById("outputText").innerText =
            "Frontend Error: " + error.message;

        console.log(error);

    }

}
</script>

</body>
</html>
